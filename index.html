<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Work Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:           #000000;
    --surface:      #0A0A0A;
    --surface-2:    #111111;
    --surface-3:    #181818;
    --border:       #1A1A1A;
    --border-2:     #262626;
    --border-3:     #333333;
    --text:         #FAFAFA;
    --text-2:       #A1A1A1;
    --text-3:       #6B6B6B;
    --text-4:       #404040;
    --accent:       #3B82F6;
    --accent-soft:  rgba(59, 130, 246, 0.12);
    --green:        #4ADE80;
    --green-soft:   rgba(74, 222, 128, 0.12);
    --amber:        #F59E0B;
    --amber-soft:   rgba(245, 158, 11, 0.10);
    --red:          #EF4444;
    --red-soft:     rgba(239, 68, 68, 0.10);

    --sans: 'Geist', -apple-system, BlinkMacSystemFont, sans-serif;
    --mono: 'Geist Mono', 'SF Mono', monospace;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--bg); color: var(--text); }
  body {
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    font-feature-settings: "ss01", "cv01", "cv11";
  }

  ::selection { background: var(--text); color: var(--bg); }

  .app {
    max-width: 1080px;
    margin: 0 auto;
    padding: 56px 40px 80px;
  }

  /* ===================== HEADER ===================== */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 48px;
    padding-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .brand-mark {
    width: 22px;
    height: 22px;
    border-radius: 4px;
    background: var(--text);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--bg);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
  }
  .brand h1 {
    font-size: 16px;
    font-weight: 500;
    letter-spacing: -0.015em;
  }
  .brand .ver {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-4);
    letter-spacing: 0.02em;
  }
  .header-right {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .sync-pill {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 10px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-2);
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: all 0.12s;
  }
  .sync-pill:hover {
    border-color: var(--border-2);
    color: var(--text);
  }
  .sync-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--text-3);
  }
  .sync-dot.connected { background: var(--green); box-shadow: 0 0 8px rgba(74, 222, 128, 0.4); }
  .sync-dot.syncing { background: var(--amber); animation: pulse 1s ease-in-out infinite; }
  .sync-dot.error { background: var(--red); }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  .header-date {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-3);
    letter-spacing: 0.02em;
  }

  /* ===================== HEAT STRIP ===================== */
  .heat-section {
    margin-bottom: 32px;
  }
  .heat-label {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }
  .heat-strip {
    display: grid;
    grid-template-columns: repeat(14, 1fr);
    gap: 3px;
  }
  .heat-cell {
    aspect-ratio: 1;
    max-height: 36px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 3px;
    position: relative;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 4px 5px;
    overflow: hidden;
    transition: all 0.12s;
  }
  .heat-cell.today {
    border-color: var(--text-3);
  }
  .heat-cell .heat-fill {
    position: absolute;
    inset: 0;
    background: var(--text);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .heat-cell .heat-day {
    font-family: var(--mono);
    font-size: 8px;
    color: var(--text-3);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    position: relative;
    z-index: 1;
    font-weight: 500;
  }
  .heat-cell .heat-val {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-2);
    position: relative;
    z-index: 1;
    font-weight: 500;
  }
  .heat-cell.filled .heat-day,
  .heat-cell.filled .heat-val {
    color: var(--bg);
  }
  .heat-cell.today.filled .heat-day {
    color: var(--bg);
  }

  /* ===================== KPIs ===================== */
  .kpis {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 1px;
    background: var(--border);
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 48px;
    overflow: hidden;
  }
  .kpi {
    background: var(--bg);
    padding: 22px 24px;
    display: flex;
    flex-direction: column;
    gap: 14px;
    position: relative;
  }
  .kpi-head {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
  }
  .kpi-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .kpi-delta {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: -0.005em;
    display: inline-flex;
    align-items: center;
    gap: 3px;
  }
  .kpi-delta.up { color: var(--green); }
  .kpi-delta.down { color: var(--red); }
  .kpi-delta.flat { color: var(--text-3); }
  .kpi-value {
    font-size: 32px;
    font-weight: 400;
    letter-spacing: -0.03em;
    line-height: 1;
    font-feature-settings: "tnum";
  }
  .kpi-value.empty { color: var(--text-3); font-weight: 300; }
  .kpi-value .unit {
    font-size: 12px;
    color: var(--text-3);
    margin-left: 5px;
    font-weight: 400;
    letter-spacing: 0;
  }
  .kpi-sub {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.02em;
  }

  /* ===================== SECTION ===================== */
  .section { margin-bottom: 48px; }
  .section-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 16px;
  }
  .section-title {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-2);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .section-actions {
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .nav-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--text-2);
    font-family: var(--mono);
    font-size: 10px;
    padding: 5px 10px;
    cursor: pointer;
    border-radius: 4px;
    transition: all 0.12s;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .nav-btn:hover {
    background: var(--surface);
    color: var(--text);
    border-color: var(--border-2);
  }
  .nav-label {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-3);
    padding: 0 10px;
    min-width: 160px;
    text-align: center;
    letter-spacing: 0.02em;
  }

  /* ===================== FORM ===================== */
  .form {
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--bg);
    overflow: hidden;
  }
  .form-main {
    display: grid;
    grid-template-columns: 170px 1fr auto auto;
    align-items: stretch;
  }
  .form-left, .form-center, .form-right {
    border-right: 1px solid var(--border);
  }
  .form-left { display: flex; flex-direction: column; }
  .form-center {
    display: flex;
    flex-direction: column;
    padding: 8px 0;
  }
  .form-right {
    display: flex;
    flex-direction: row;
    align-items: stretch;
  }
  .date-field {
    flex: 1;
  }
  .segments {
    display: flex;
    flex-direction: column;
  }
  .segment-row {
    display: grid;
    grid-template-columns: 1fr 1fr auto;
    align-items: stretch;
  }
  .segment-row + .segment-row {
    border-top: 1px dashed var(--border);
  }
  .segment-row .field {
    border-right: 1px solid var(--border);
  }
  .segment-row .field:last-of-type {
    border-right: none;
  }
  .segment-remove {
    background: transparent;
    border: none;
    color: var(--text-4);
    cursor: pointer;
    font-family: var(--mono);
    font-size: 14px;
    padding: 0 14px;
    transition: all 0.12s;
    line-height: 1;
    align-self: center;
  }
  .segment-remove:hover {
    color: var(--red);
  }
  .segment-row:only-child .segment-remove {
    visibility: hidden;
  }
  .btn-add-segment {
    background: transparent;
    border: none;
    border-top: 1px dashed var(--border);
    color: var(--text-3);
    font-family: var(--mono);
    font-size: 10px;
    cursor: pointer;
    padding: 10px 16px;
    transition: all 0.12s;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 500;
    text-align: left;
    margin-top: 0;
  }
  .btn-add-segment:hover {
    color: var(--text);
    background: var(--surface);
  }
  .field {
    display: flex;
    flex-direction: column;
    padding: 12px 16px;
    position: relative;
  }
  .field label {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 500;
    margin-bottom: 6px;
  }
  .field input {
    font-family: var(--sans);
    font-size: 14px;
    font-weight: 400;
    padding: 4px 0;
    border: none;
    background: transparent;
    color: var(--text);
    transition: color 0.12s;
    outline: none;
    width: 100%;
    color-scheme: dark;
    letter-spacing: -0.005em;
  }
  .field input::placeholder { color: var(--text-4); }
  .field input::-webkit-calendar-picker-indicator {
    filter: invert(0.5);
    cursor: pointer;
    opacity: 0.6;
    transition: opacity 0.12s;
  }
  .field input::-webkit-calendar-picker-indicator:hover { opacity: 1; }
  .field.focused { background: var(--surface); }
  .field.focused label { color: var(--text-2); }
  .field-readout {
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    gap: 2px;
    background: var(--surface);
    min-width: 100px;
  }
  .field-readout .v {
    font-family: var(--sans);
    font-size: 18px;
    font-weight: 500;
    line-height: 1;
    letter-spacing: -0.02em;
    font-feature-settings: "tnum";
  }
  .field-readout .v.empty { color: var(--text-3); font-weight: 300; }
  .field-readout .u {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .field-readout.overnight .u { color: var(--amber); }
  .field-readout-secondary {
    padding: 14px 18px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    gap: 2px;
    background: var(--bg);
    border-left: 1px solid var(--border);
    min-width: 80px;
  }
  .field-readout-secondary .v {
    font-family: var(--mono);
    font-size: 14px;
    font-weight: 500;
    color: var(--text-2);
    line-height: 1;
    font-feature-settings: "tnum";
  }
  .field-readout-secondary .u {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .btn-save {
    font-family: var(--sans);
    font-size: 13px;
    font-weight: 500;
    padding: 0 24px;
    background: var(--text);
    color: var(--bg);
    border: none;
    border-radius: 0;
    cursor: pointer;
    transition: all 0.12s;
    white-space: nowrap;
    letter-spacing: -0.005em;
    min-width: 110px;
  }
  .btn-save:hover { background: #E5E5E5; }
  .btn-save:active { background: #D4D4D4; }
  .btn-save.editing { background: var(--accent); color: var(--text); }
  .btn-save.editing:hover { background: #2563EB; }
  .form-note-row {
    display: flex;
    border-top: 1px solid var(--border);
  }
  .form-note-row .field {
    flex: 1;
    border-right: none;
  }
  .form-cancel {
    background: transparent;
    border: none;
    border-left: 1px solid var(--border);
    color: var(--text-3);
    font-family: var(--mono);
    font-size: 10px;
    padding: 0 20px;
    cursor: pointer;
    transition: color 0.12s;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 500;
    display: none;
  }
  .form-cancel.visible { display: block; }
  .form-cancel:hover { color: var(--red); }

  /* ===================== TIMELINE ===================== */
  .timeline {
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 20px 24px 24px;
    background: var(--bg);
  }
  .tl-axis {
    display: grid;
    grid-template-columns: 80px 1fr 60px;
    align-items: end;
    height: 18px;
    margin-bottom: 12px;
  }
  .tl-axis-hours {
    position: relative;
    height: 16px;
  }
  .tl-axis-tick {
    position: absolute;
    bottom: 0;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.02em;
    transform: translateX(-50%);
  }
  .tl-axis-tick.midnight { color: var(--text-2); }
  .tl-row {
    display: grid;
    grid-template-columns: 80px 1fr 60px;
    align-items: center;
    height: 48px;
    position: relative;
  }
  .tl-row + .tl-row {
    border-top: 1px solid var(--border);
  }
  .tl-row.week-break {
    border-top: 1px solid var(--border-2);
    margin-top: 6px;
    padding-top: 6px;
  }
  .tl-row.today::before {
    content: "";
    position: absolute;
    left: -24px;
    top: 50%;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
    transform: translateY(-50%);
    box-shadow: 0 0 10px var(--accent);
  }
  .tl-day {
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-right: 16px;
    gap: 2px;
  }
  .tl-day .name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    letter-spacing: -0.01em;
  }
  .tl-day .name.weekend { color: var(--text-2); }
  .tl-day .name.today { color: var(--accent); }
  .tl-day .date {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.02em;
  }
  .tl-track {
    position: relative;
    height: 32px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .tl-track-gridline {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--border-2);
  }
  .tl-track-gridline.midnight {
    background: var(--border-3);
  }
  .tl-bar {
    position: absolute;
    top: 4px;
    bottom: 4px;
    background: var(--text);
    border-radius: 8px;
    display: flex;
    align-items: center;
    padding: 0 10px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--bg);
    font-weight: 500;
    overflow: hidden;
    white-space: nowrap;
    letter-spacing: 0.02em;
    z-index: 2;
  }
  .tl-bar.today {
    background: var(--accent);
    color: var(--text);
  }
  .tl-bar.continuation {
    background: var(--text-2);
    color: var(--bg);
  }
  .tl-bar.continuation.today {
    background: var(--accent);
    opacity: 0.6;
  }
  .tl-hours {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    text-align: right;
    letter-spacing: -0.01em;
    font-feature-settings: "tnum";
  }
  .tl-hours.empty {
    color: var(--text-3);
    font-weight: 400;
  }
  .tl-totals {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding-top: 18px;
    margin-top: 20px;
    border-top: 1px solid var(--border);
  }
  .tl-totals .label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-weight: 500;
  }
  .tl-totals .value {
    font-size: 20px;
    font-weight: 400;
    color: var(--text);
    letter-spacing: -0.025em;
    font-feature-settings: "tnum";
  }
  .tl-totals .value .unit {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-3);
    margin-left: 5px;
    letter-spacing: 0;
  }

  /* ===================== FOOTER ===================== */
  .footer-actions {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 16px;
  }
  .footer-actions-left,
  .footer-actions-right {
    display: flex;
    gap: 4px;
    align-items: center;
  }
  .btn-text {
    background: transparent;
    border: none;
    color: var(--text-3);
    font-family: var(--mono);
    font-size: 10px;
    cursor: pointer;
    padding: 6px 10px;
    transition: color 0.12s;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    font-weight: 500;
    border-radius: 3px;
  }
  .btn-text:hover {
    color: var(--text);
    background: var(--surface);
  }
  .btn-text.danger:hover {
    color: var(--red);
    background: var(--red-soft);
  }
  .last-sync {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-4);
    letter-spacing: 0.02em;
    padding-right: 8px;
  }

  /* ===================== LOCKED STATE ===================== */
  body.locked .form input,
  body.locked .form button { pointer-events: none; }
  body.locked .form input { color: var(--text-3); }
  body.locked .field-readout .v { color: var(--text-3); }
  body.locked .form { opacity: 0.55; filter: grayscale(0.2); }
  body.locked .form-main .btn-save,
  body.locked #btn-reset,
  body.locked #form-cancel,
  body.locked #btn-add-segment,
  body.locked .segment-remove { display: none !important; }

  .lock-indicator {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: 4px;
    background: var(--surface);
  }
  body.unlocked .lock-indicator {
    color: var(--green);
    border-color: rgba(74, 222, 128, 0.3);
    background: var(--green-soft);
  }

  /* Password prompt */
  .pw-prompt-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.75);
    z-index: 60;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 24px;
    backdrop-filter: blur(6px);
  }
  .pw-prompt-backdrop.visible { display: flex; }
  .pw-prompt {
    width: 100%;
    max-width: 360px;
    background: var(--bg);
    border: 1px solid var(--border-2);
    border-radius: 6px;
    padding: 24px;
  }
  .pw-prompt.shake { animation: shake 0.4s; border-color: var(--red); }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
  .pw-prompt-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-3);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 12px;
    display: block;
  }
  .pw-prompt input {
    width: 100%;
    font-family: var(--mono);
    font-size: 14px;
    padding: 12px 14px;
    border: 1px solid var(--border-2);
    border-radius: 4px;
    background: var(--surface);
    color: var(--text);
    outline: none;
    letter-spacing: 0.05em;
  }

  /* ===================== TOAST ===================== */
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--text);
    color: var(--bg);
    padding: 10px 18px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: all 0.2s;
    z-index: 100;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--red); color: var(--text); }

  @media (max-width: 900px) {
    .app { padding: 40px 24px 60px; }
    .kpis { grid-template-columns: repeat(2, 1fr); }
    .form-main { grid-template-columns: 1fr; }
    .form-left, .form-center, .form-right {
      border-right: none;
      border-bottom: 1px solid var(--border);
    }
    .btn-save { width: 100%; padding: 14px 0; }
    .tl-axis, .tl-row { grid-template-columns: 60px 1fr 48px; }
  }
</style>
</head>
<body>

<div class="app">

  <header class="header">

      <span class="lock-indicator" id="lock-indicator">
        <span id="lock-text">Read only</span>

    </div>

  <section class="heat-section">
    <div class="heat-label">
      <span>Current 2 Weeks</span>

    </div>
    <div class="kpi">
      <div class="kpi-head">

      </div>
      <div class="kpi-value" id="kpi-month">0<span class="unit">hrs</span></div>

    </div>
    <div class="kpi">

  <section class="section">

<div class="pw-prompt-backdrop" id="pw-backdrop">

    <label class="pw-prompt-label">Enter password</label>
    <input type="password" id="pw-input" autocomplete="off" />
  </div>
</div>

<div class="toast" id="toast">Saved</div>

<script>
const API_NAMESPACE = 'Kedhar';
const STORAGE_KEY = 'workLog_v2_data_jun4';
let shifts = [];
let editingId = null;
let isUnlocked = false;

const TODAY = new Date();
TODAY.setHours(0, 0, 0, 0);

let viewWeekStart;

function lock() {
  isUnlocked = false;
  document.body.classList.remove('unlocked');
  document.body.classList.add('locked');
  document.getElementById('lock-text').textContent = 'Read only';
}
function unlock() {
  isUnlocked = true;
  document.body.classList.remove('locked');
  document.body.classList.add('unlocked');
  document.getElementById('lock-text').textContent = 'Editable';
}
function showPwPrompt() {
  document.getElementById('pw-backdrop').classList.add('visible');
  setTimeout(() => document.getElementById('pw-input').focus(), 50);
}
function hidePwPrompt() {
  document.getElementById('pw-backdrop').classList.remove('visible');
  document.getElementById('pw-input').value = '';
}
function tryUnlock() {
  const val = document.getElementById('pw-input').value;
  if (val === API_NAMESPACE) { unlock(); hidePwPrompt(); toast('Unlocked'); }
  else {
    const p = document.getElementById('pw-prompt');
    p.classList.remove('shake'); void p.offsetWidth; p.classList.add('shake');
    document.getElementById('pw-input').value = '';
  }
}

function loadShifts() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch(e) {}
  return seedSamples();
}
function saveShiftsLocal() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(shifts)); } catch(e) {}
}

function seedSamples() {
  // Pay period Jun 6 - Jun 19, 2026
  const PAY_START = new Date(2026, 5, 6);
  const pattern = [
    { offset: 0,  start: '21:00', end: '02:00' }, // Sat Jun 6
    { offset: 1,  start: '21:00', end: '02:00' }, // Sun Jun 7
    { offset: 2,  start: '21:00', end: '01:00' }, // Mon Jun 8
    { offset: 3,  start: '21:00', end: '02:30' }, // Tue Jun 9
    { offset: 4,  start: '21:00', end: '01:00' }, // Wed Jun 10
    { offset: 5,  start: '21:00', end: '02:30' }, // Thu Jun 11
    // Fri Jun 12 — off
    { offset: 7,  start: '00:00', end: '02:30' }, // Sat Jun 13
    // Sun Jun 14 — off
    { offset: 9,  start: '21:00', end: '02:30' }, // Mon Jun 15
    { offset: 10, start: '21:00', end: '02:00' }, // Tue Jun 16
    { offset: 11, start: '21:00', end: '03:30' }, // Wed Jun 17
    { offset: 12, start: '22:00', end: '02:40' }, // Thu Jun 18
    // Fri Jun 19 — off
  ];
  return pattern.map((p, i) => {
    const d = new Date(PAY_START);
    d.setDate(PAY_START.getDate() + p.offset);
    return { id: 'shift-' + i, date: fmtDate(d), start: p.start, end: p.end, break: 0, note: '' };
  });
}

function fmtDate(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function parseDate(s) { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function parseTime(t) { if(!t) return null; const [h,m]=t.split(':').map(Number); return h+m/60; }
function fmtTime12(t) {
  if (!t) return '—';
  const [h,m] = t.split(':').map(Number);
  const suffix = h<12?'AM':'PM';
  const display = h===0?12:h>12?h-12:h;
  return m===0?`${display}:00 ${suffix}`:`${display}:${String(m).padStart(2,'0')} ${suffix}`;
}
function fmtHour(h) {
  if (h===0||h===24) return '12a';
  if (h===12) return '12p';
  const whole = Math.floor(h), min = Math.round((h-whole)*60);
  const suffix = whole<12?'a':'p';
  const display = whole===0?12:whole>12?whole-12:whole;
  return min===0?`${display}${suffix}`:`${display}:${String(min).padStart(2,'0')}${suffix}`;
}
function sameDay(a,b) { return a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate(); }

function getSegments(shift) {
  if (!shift) return [];
  if (Array.isArray(shift.segments)&&shift.segments.length>0) return shift.segments.filter(s=>s.start&&s.end);
  if (shift.start&&shift.end) return [{start:shift.start,end:shift.end}];
  return [];
}
function computeShiftHours(shift) {
  if (!shift) return 0;
  const segs = getSegments(shift);
  let total = 0;
  segs.forEach(seg => {
    const s = parseTime(seg.start), e = parseTime(seg.end);
    if (s===null||e===null) return;
    let diff = e-s; if (diff<=0) diff+=24; total+=diff;
  });
  total -= (parseFloat(shift.break)||0);
  return Math.max(0, Math.round(total*100)/100);
}

const PAY_ANCHOR = new Date(2026, 4, 9);
PAY_ANCHOR.setHours(0,0,0,0);
function currentPayPeriodStart(d) {
  const target = new Date(d); target.setHours(0,0,0,0);
  const daysSince = Math.floor((target-PAY_ANCHOR)/86400000);
  const periodIndex = Math.floor(daysSince/14);
  const start = new Date(PAY_ANCHOR); start.setDate(PAY_ANCHOR.getDate()+periodIndex*14);
  return start;
}
function payPeriodEnd(start) { const end = new Date(start); end.setDate(start.getDate()+13); return end; }
function previousPayPeriodStart(d) {
  const cur = currentPayPeriodStart(d); const prev = new Date(cur); prev.setDate(cur.getDate()-14); return prev;
}
function daysUntilPayday(d) {
  const periodEnd = payPeriodEnd(currentPayPeriodStart(d));
  const payday = new Date(periodEnd); payday.setDate(periodEnd.getDate()+1);
  const diff = Math.ceil((payday-d)/86400000);
  return Math.max(0, diff);
}

function render() {
  document.getElementById('header-date').textContent =
    TODAY.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  renderHeatStrip();
  renderKPIs();
  renderTimeline();
}

function renderHeatStrip() {
  const strip = document.getElementById('heat-strip');
  const periodStart = currentPayPeriodStart(TODAY);
  const periodEnd = payPeriodEnd(periodStart);
  document.getElementById('heat-range').textContent =
    `${periodStart.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${periodEnd.toLocaleDateString('en-US',{month:'short',day:'numeric'})}`;
  const DOW_LETTER = ['S','M','T','W','T','F','S'];
  let html = '';
  for (let i=0; i<14; i++) {
    const d = new Date(periodStart); d.setDate(periodStart.getDate()+i);
    const shift = shifts.find(s=>s.date===fmtDate(d));
    const hrs = computeShiftHours(shift);
    const intensity = Math.min(hrs/8, 1);
    const isToday = sameDay(d, TODAY);
    const filled = hrs>0;
    const letter = DOW_LETTER[d.getDay()];
    html += `<div class="heat-cell ${isToday?'today':''} ${filled?'filled':''}" title="${d.toLocaleDateString('en-US',{weekday:'long',month:'short',day:'numeric'})}${hrs?' — '+hrs+' hrs':' — no entry'}"><div class="heat-fill" style="opacity:${intensity*0.95};"></div><span class="heat-day">${letter}</span><span class="heat-val">${hrs>0?hrs:''}</span></div>`;
  }
  strip.innerHTML = html;
}

function renderKPIs() {
  const sumInRange = (start,end) =>
    shifts.filter(s=>{const d=parseDate(s.date); return d>=start&&d<=end;}).reduce((a,s)=>a+computeShiftHours(s),0);
  const curStart = currentPayPeriodStart(TODAY), curEnd = payPeriodEnd(curStart);
  const curHrs = sumInRange(curStart, curEnd);
  const prevStart = previousPayPeriodStart(TODAY), prevEnd = payPeriodEnd(prevStart);
  const prevHrs = sumInRange(prevStart, prevEnd);
  const daysToPay = daysUntilPayday(TODAY);
  const total = shifts.reduce((a,s)=>a+computeShiftHours(s),0);
  const totalCount = shifts.filter(s=>computeShiftHours(s)>0).length;

  setKPI('kpi-week', curHrs, 'hrs');
  setKPI('kpi-month', prevHrs, 'hrs');
  setKPI('kpi-total', total, 'hrs');
  const dpEl = document.getElementById('kpi-avg');
  dpEl.innerHTML = `${daysToPay}<span class="unit">${daysToPay===1?'day':'days'}</span>`;
  setDelta('delta-week', curHrs, prevHrs);
  setDelta('delta-month', prevHrs, 0);
  document.getElementById('delta-avg').textContent = daysToPay===0?'Last day':'';
  document.getElementById('delta-total').textContent = `${totalCount} entries`;

  const fmtRange = (s,e) => `${s.toLocaleDateString('en-US',{month:'short',day:'numeric'})}–${e.toLocaleDateString('en-US',{month:'short',day:'numeric'})}`;
  document.getElementById('kpi-week-sub').textContent = fmtRange(curStart, curEnd);
  document.getElementById('kpi-month-sub').textContent = fmtRange(prevStart, prevEnd);
  document.getElementById('kpi-avg-sub').textContent =
    daysToPay===0?'Cycle ends today':`Ends ${curEnd.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'})}`;
}
function setKPI(id, value, unit) {
  const el = document.getElementById(id);
  const v = Math.round(value*10)/10;
  el.innerHTML = `${v||0}<span class="unit">${unit}</span>`;
  el.classList.toggle('empty', v===0);
}
function setDelta(id, current, previous) {
  const el = document.getElementById(id);
  if (previous===0&&current===0) { el.textContent='—'; el.className='kpi-delta flat'; return; }
  if (previous===0) { el.textContent='New'; el.className='kpi-delta up'; return; }
  if (current===0) { el.textContent='—'; el.className='kpi-delta down'; return; }
  const pct = Math.round(((current-previous)/previous)*100);
  if (Math.abs(pct)<1) { el.textContent='—'; el.className='kpi-delta flat'; return; }
  el.textContent = `${pct>0?'▲':'▼'} ${Math.abs(pct)}%`;
  el.className = `kpi-delta ${pct>0?'up':'down'}`;
}

function getCycleDays() {
  const days = [];
  for (let i=0; i<14; i++) {
    const d = new Date(viewWeekStart); d.setDate(viewWeekStart.getDate()+i);
    days.push({date:d, shift: shifts.find(s=>s.date===fmtDate(d))});
  }
  return days;
}
function renderTimeline() {
  const cycleEnd = new Date(viewWeekStart); cycleEnd.setDate(viewWeekStart.getDate()+13);
  document.getElementById('week-label').textContent =
    `${viewWeekStart.toLocaleDateString('en-US',{month:'short',day:'numeric'})} – ${cycleEnd.toLocaleDateString('en-US',{month:'short',day:'numeric'})}`;
  const days = getCycleDays();
  const total = days.reduce((sum,{shift})=>sum+computeShiftHours(shift), 0);
  document.getElementById('week-total').innerHTML = `${Math.round(total*10)/10}<span class="unit">hrs</span>`;
  renderGantt(days, document.getElementById('tl-rows'));
}
function renderGantt(cycleDays, stage) {
  // For night-shift layout: treat any shift starting before this hour
  // as the tail-end of the previous evening (add 24 to its display position).
  // The underlying data is unchanged — this only affects visual placement.
  const DAY_BOUNDARY = 12; // noon
  const shiftIfEarly = (h) => h < DAY_BOUNDARY ? h + 24 : h;

  let axisStart=null, axisEnd=null;
  cycleDays.forEach(({shift}) => {
    getSegments(shift).forEach(seg => {
      let sH = shiftIfEarly(parseTime(seg.start));
      let eH = shiftIfEarly(parseTime(seg.end));
      if (eH<=sH) eH+=24;
      if (axisStart===null||sH<axisStart) axisStart=sH;
      if (axisEnd===null||eH>axisEnd) axisEnd=eH;
    });
  });
  if (axisStart===null) { axisStart=18; axisEnd=30; }
  else { axisStart = Math.max(0, Math.floor(axisStart-1)); axisEnd = Math.min(48, Math.ceil(axisEnd+1)); }
  const axisSpan = axisEnd-axisStart;
  const toPct = h => ((h-axisStart)/axisSpan)*100;
  const tickInterval = axisSpan<=8?1:axisSpan<=14?2:3;

  let axisHTML = '';
  const firstTick = Math.ceil(axisStart);
  for (let h=firstTick; h<=axisEnd; h+=tickInterval) {
    const pct = toPct(h); if (pct<0||pct>100) continue;
    const nh = ((h%24)+24)%24;
    axisHTML += `<div class="tl-axis-tick ${nh===0?'midnight':''}" style="left:${pct}%;">${fmtHour(nh)}</div>`;
  }
  document.getElementById('tl-axis-hours').innerHTML = axisHTML;

  const dayNames = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  let rowsHTML = '';
  cycleDays.forEach(({date:d, shift}, i) => {
    const dow = d.getDay(); const isWeekend = dow===0||dow===6;
    const isToday = sameDay(d, TODAY); const isWeekDivider = i===7;
    let trackHTML = '';
    for (let h=firstTick; h<=axisEnd; h+=tickInterval) {
      const pct = toPct(h); if (pct<=0||pct>=100) continue;
      const nh = ((h%24)+24)%24;
      trackHTML += `<div class="tl-track-gridline ${nh===0?'midnight':''}" style="left:${pct}%;"></div>`;
    }
    const segs = getSegments(shift); const totalH = computeShiftHours(shift);
    let hoursLabel = segs.length>0 ? `${totalH}h` : '<span class="empty">—</span>';
    segs.forEach(seg => {
      let startH = shiftIfEarly(parseTime(seg.start));
      let endH = shiftIfEarly(parseTime(seg.end));
      if (endH<=startH) endH+=24;
      const leftPct = toPct(startH); const widthPct = toPct(endH)-leftPct;
      const labelText = widthPct>14 ? `${fmtTime12(seg.start)} → ${fmtTime12(seg.end)}`
        : widthPct>8 ? `${fmtHour(((startH%24)+24)%24)}–${fmtHour(((endH%24)+24)%24)}` : '';
      trackHTML += `<div class="tl-bar ${isToday?'today':''}" style="left:${leftPct}%;width:${widthPct}%;" title="${fmtTime12(seg.start)} – ${fmtTime12(seg.end)}">${labelText}</div>`;
    });
    rowsHTML += `<div class="tl-row ${isToday?'today':''} ${isWeekDivider?'week-break':''}"><div class="tl-day"><span class="name ${isWeekend?'weekend':''} ${isToday?'today':''}">${dayNames[dow]}</span><span class="date">${d.toLocaleDateString('en-US',{month:'short',day:'numeric'})}</span></div><div class="tl-track">${trackHTML}</div><div class="tl-hours ${segs.length===0?'empty':''}">${hoursLabel}</div></div>`;
  });
  stage.innerHTML = rowsHTML;
}

let formSegments = [{start:'21:00', end:'02:00'}];
function renderSegments() {
  const container = document.getElementById('segments');
  container.innerHTML = formSegments.map((seg, i) => `
    <div class="segment-row" data-idx="${i}">
      <div class="field"><label>${i===0?'Start':'Start '+(i+1)}</label><input type="time" class="seg-start" data-idx="${i}" value="${seg.start||''}" /></div>
      <div class="field"><label>${i===0?'End':'End '+(i+1)}</label><input type="time" class="seg-end" data-idx="${i}" value="${seg.end||''}" /></div>
      <button type="button" class="segment-remove" data-idx="${i}">×</button>
    </div>`).join('');
  container.querySelectorAll('.seg-start, .seg-end').forEach(el => {
    el.addEventListener('input', e => {
      const idx = parseInt(e.target.dataset.idx);
      const field = e.target.classList.contains('seg-start')?'start':'end';
      if (formSegments[idx]) formSegments[idx][field] = e.target.value;
      updateComputed();
    });
  });
  container.querySelectorAll('.segment-remove').forEach(btn => {
    btn.addEventListener('click', () => {
      const idx = parseInt(btn.dataset.idx);
      formSegments.splice(idx,1);
      if (formSegments.length===0) formSegments=[{start:'',end:''}];
      renderSegments(); updateComputed();
    });
  });
}
function updateComputed() {
  const validSegs = formSegments.filter(s=>s.start&&s.end);
  let totalWorked=0, anyOvernight=false;
  validSegs.forEach(seg => {
    const sH=parseTime(seg.start), eH=parseTime(seg.end);
    if (sH===null||eH===null) return;
    let diff=eH-sH; if (diff<=0) { diff+=24; anyOvernight=true; }
    totalWorked+=diff;
  });
  let totalBreak=0;
  if (validSegs.length>=2) {
    for (let i=1; i<validSegs.length; i++) {
      const prevEnd=parseTime(validSegs[i-1].end), currStart=parseTime(validSegs[i].start);
      if (prevEnd===null||currStart===null) continue;
      let gap=currStart-prevEnd; if (gap<0) gap+=24;
      if (gap>0&&gap<24) totalBreak+=gap;
    }
  }
  totalWorked=Math.max(0,Math.round(totalWorked*100)/100);
  totalBreak=Math.max(0,Math.round(totalBreak*100)/100);
  const cv = document.getElementById('computed-v');
  cv.textContent = totalWorked||'0';
  document.getElementById('computed-u').textContent = anyOvernight?'Overnight':'Hours';
  document.getElementById('computed').classList.toggle('overnight', anyOvernight);
  const breakReadout = document.getElementById('break-readout');
  if (totalBreak>0) { breakReadout.style.display=''; document.getElementById('break-v').textContent=`${totalBreak}h`; }
  else breakReadout.style.display='none';
}
function addSegment() {
  let defaultStart='', defaultEnd='';
  const last = formSegments[formSegments.length-1];
  if (last&&last.end) {
    const eH = parseTime(last.end);
    if (eH!==null) {
      const newStart = (Math.ceil(eH)+1)%24;
      defaultStart = `${String(Math.floor(newStart)).padStart(2,'0')}:00`;
    }
  }
  formSegments.push({start:defaultStart,end:defaultEnd});
  renderSegments(); updateComputed();
}

function saveShift() {
  if (!isUnlocked) return;
  const date = document.getElementById('in-date').value;
  const note = document.getElementById('in-note').value.trim();
  if (!date) { toast('Pick a date', true); return; }
  const validSegs = formSegments.filter(s=>s.start&&s.end);
  if (validSegs.length===0) { toast('Add a segment', true); return; }
  let existingIdx = editingId ? shifts.findIndex(s=>s.id===editingId) : shifts.findIndex(s=>s.date===date);
  let entry;
  if (validSegs.length===1) {
    entry = { id: existingIdx>=0?shifts[existingIdx].id:'shift-'+Date.now(), date, start:validSegs[0].start, end:validSegs[0].end, break:0, note };
  } else {
    entry = { id: existingIdx>=0?shifts[existingIdx].id:'shift-'+Date.now(), date, start:validSegs[0].start, end:validSegs[0].end, break:0, note, segments:validSegs.map(s=>({start:s.start,end:s.end})) };
  }
  if (existingIdx>=0) shifts[existingIdx]=entry; else shifts.push(entry);
  saveShiftsLocal();
  toast(existingIdx>=0?'Updated':'Saved');
  cancelEdit(); render();
}
function cancelEdit() {
  editingId = null;
  document.getElementById('btn-save').textContent='Save';
  document.getElementById('btn-save').classList.remove('editing');
  document.getElementById('form-cancel').classList.remove('visible');
  document.getElementById('form-title').textContent='Log a Shift';
  document.getElementById('in-note').value='';
  formSegments=[{start:'21:00',end:'02:00'}];
  renderSegments(); updateComputed();
}
function resetToSamples() {
  if (!isUnlocked) return;
  if (!confirm('Reset all entries?')) return;
  localStorage.removeItem(STORAGE_KEY);
  shifts = loadShifts();
  render(); toast('Reset');
}
function exportCSV() {
  const rows = [['Date','Day','Segments','Hours','Note']];
  [...shifts].sort((a,b)=>a.date.localeCompare(b.date)).forEach(s => {
    const d = parseDate(s.date);
    const segs = getSegments(s);
    const segStr = segs.map(seg=>`${seg.start}–${seg.end}`).join(' | ');
    rows.push([s.date, d.toLocaleDateString('en-US',{weekday:'long'}), segStr, computeShiftHours(s), (s.note||'').replace(/"/g,'""')]);
  });
  const csv = rows.map(r=>r.map(c=>`"${c}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download=`work_log_${fmtDate(new Date())}.csv`; a.click();
  URL.revokeObjectURL(url); toast('Exported');
}
function toast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.toggle('error', !!isError); t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1500);
}

// INIT
lock();
viewWeekStart = currentPayPeriodStart(TODAY);
shifts = loadShifts();
document.getElementById('in-date').value = fmtDate(TODAY);
document.getElementById('btn-save').addEventListener('click', saveShift);
document.getElementById('form-cancel').addEventListener('click', () => { cancelEdit(); render(); });
document.getElementById('btn-reset').addEventListener('click', resetToSamples);
document.getElementById('btn-export').addEventListener('click', exportCSV);
document.getElementById('btn-add-segment').addEventListener('click', () => { if (isUnlocked) addSegment(); });
document.getElementById('prev-week').addEventListener('click', () => {
  viewWeekStart.setDate(viewWeekStart.getDate()-14);
  viewWeekStart = new Date(viewWeekStart); renderTimeline();
});
document.getElementById('next-week').addEventListener('click', () => {
  viewWeekStart.setDate(viewWeekStart.getDate()+14);
  viewWeekStart = new Date(viewWeekStart); renderTimeline();
});
document.getElementById('this-week').addEventListener('click', () => {
  viewWeekStart = currentPayPeriodStart(TODAY); renderTimeline();
});
document.addEventListener('keydown', e => {
  if ((e.metaKey||e.ctrlKey)&&(e.key==='e'||e.key==='E')) {
    e.preventDefault();
    if (isUnlocked) { lock(); toast('Locked'); } else showPwPrompt();
    return;
  }
  const pwBackdrop = document.getElementById('pw-backdrop');
  if (pwBackdrop.classList.contains('visible')) {
    if (e.key==='Enter') { e.preventDefault(); tryUnlock(); }
    else if (e.key==='Escape') hidePwPrompt();
  }
});
document.getElementById('pw-backdrop').addEventListener('click', e => {
  if (e.target.id==='pw-backdrop') hidePwPrompt();
});
renderSegments(); updateComputed(); render();
</script>

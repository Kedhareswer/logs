<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Work Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;

    --canvas:     #0F0F0E;
    --surface:    #161615;
    --surface-2:  #1C1C1A;
    --border:     #262624;
    --border-2:   #34342F;

    --text:       #F0EFEC;
    --text-hi:    #FFFFFF;
    --text-2:     #A3A19B;
    --text-3:     #7A7873;
    --text-4:     #4C4A46;

    --data:       #6BB3E8;
    --data-soft:  #14293A;
    --data-line:  #2A3F52;
    --on-accent:  #0F1B26;

    --bar:        #CFCDC7;
    --bar-text:   #161615;

    --green:      #7FBF86;
    --green-soft: #17251A;
    --green-line: #2B3D2E;
    --amber:      #D9A441;
    --amber-soft: #262013;
    --amber-line: #3D3320;
    --red:        #E8827F;
    --red-soft:   #2A1918;

    --lift:       0 2px 10px rgba(0,0,0,0.4);

    --sans:   'Geist', 'SF Pro Display', 'Helvetica Neue', sans-serif;
    --serif:  'Newsreader', 'Lyon Text', 'Instrument Serif', serif;
    --mono:   'Geist Mono', 'SF Mono', monospace;

    --ease: cubic-bezier(0.16, 1, 0.3, 1);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--canvas); }
  body {
    background: var(--canvas);
    color: var(--text);
    font-family: var(--sans);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-feature-settings: "ss01", "cv01", "cv11";
  }
  ::selection { background: var(--text); color: var(--canvas); }

  .ambient {
    position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      radial-gradient(1100px 700px at 8% -8%, rgba(107,179,232,0.07), transparent 60%),
      radial-gradient(800px 600px at 98% 4%, rgba(217,164,65,0.05), transparent 60%);
  }

  .app {
    position: relative; z-index: 1;
    max-width: 1720px;
    margin: 0 auto;
    padding: 28px 32px 56px;
  }

  /* ===================== REVEAL ===================== */
  .reveal { opacity: 0; transform: translateY(10px); }
  .reveal.in {
    opacity: 1; transform: none;
    transition: opacity 500ms var(--ease), transform 500ms var(--ease);
    transition-delay: calc(var(--i, 0) * 70ms);
  }
  @media (prefers-reduced-motion: reduce) {
    .reveal, .reveal.in { opacity: 1; transform: none; transition: none; }
  }

  /* ===================== HEADER ===================== */
  .header {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 24px; flex-wrap: wrap;
    padding-bottom: 18px; margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .brand { display: flex; align-items: baseline; gap: 14px; }
  .brand h1 {
    font-family: var(--serif); font-size: 27px; font-weight: 400;
    letter-spacing: -0.025em; line-height: 1;
  }
  .brand p {
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.07em; text-transform: uppercase; color: var(--text-3);
  }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .header-date { font-family: var(--mono); font-size: 11px; color: var(--text-3); }

  .badge {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 4px 11px; border-radius: 9999px;
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.06em; text-transform: uppercase;
    background: var(--surface-2); color: var(--text-2);
    border: 1px solid var(--border); cursor: pointer;
    transition: background 200ms var(--ease), color 200ms var(--ease);
  }
  .badge:active { transform: scale(0.98); }
  body.unlocked .badge { background: var(--green-soft); color: var(--green); border-color: var(--green-line); }
  .badge .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-4); }
  body.unlocked .badge .dot { background: var(--green); }
  kbd {
    font-family: var(--mono); font-size: 10px;
    padding: 2px 5px; border: 1px solid var(--border);
    border-radius: 4px; background: var(--surface-2); color: var(--text-2);
  }

  /* ===================== WORKSPACE ===================== */
  .workspace {
    display: grid;
    grid-template-columns: minmax(0, 1fr) 372px;
    gap: 24px;
    align-items: start;
  }
  .main { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
  .rail { position: sticky; top: 24px; display: flex; flex-direction: column; gap: 16px; }

  .panel {
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--surface);
  }
  .panel-head {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; padding: 14px 18px;
    border-bottom: 1px solid var(--border);
  }
  .panel-title {
    font-family: var(--mono); font-size: 10px;
    letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-2);
  }
  .panel-meta { font-family: var(--mono); font-size: 10px; color: var(--text-3); }
  .panel-body { padding: 18px; }

  /* ===================== STAT BAR ===================== */
  .statbar {
    display: grid; grid-template-columns: repeat(4, 1fr);
    border: 1px solid var(--border); border-radius: 12px;
    background: var(--surface); overflow: hidden;
  }
  .stat {
    padding: 14px 20px;
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column; gap: 3px;
  }
  .stat:last-child { border-right: none; }
  .stat-label {
    font-family: var(--mono); font-size: 9.5px;
    letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-3);
  }
  .stat-row { display: flex; align-items: baseline; gap: 9px; }
  .stat-value {
    font-family: var(--serif); font-size: 30px; font-weight: 300;
    letter-spacing: -0.03em; line-height: 1;
  }
  .stat-value.empty { color: var(--text-4); }
  .stat-value .unit {
    font-family: var(--mono); font-size: 11px; color: var(--text-3); margin-left: 6px;
  }
  .stat-delta {
    font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.03em;
    padding: 2px 7px; border-radius: 9999px; white-space: nowrap;
  }
  .stat-delta.up   { background: var(--green-soft); color: var(--green); }
  .stat-delta.down { background: var(--red-soft);   color: var(--red); }
  .stat-delta.flat { background: var(--surface-2);  color: var(--text-3); }
  .stat-sub { font-family: var(--mono); font-size: 10px; color: var(--text-3); }

  /* ===================== CYCLE NAV ===================== */
  .nav { display: flex; align-items: center; gap: 6px; }
  .nav-btn {
    padding: 5px 11px;
    border: 1px solid var(--border); border-radius: 6px;
    background: var(--surface-2);
    font-family: var(--mono); font-size: 11px; color: var(--text-2);
    cursor: pointer; transition: all 180ms var(--ease);
  }
  .nav-btn:hover { border-color: var(--border-2); color: var(--text); }
  .nav-btn:active { transform: scale(0.98); }
  .cycle-label {
    font-family: var(--mono); font-size: 12px; color: var(--text);
    min-width: 128px; text-align: center;
  }
  .cycle-total { font-family: var(--serif); font-size: 21px; font-weight: 300; letter-spacing: -0.02em; }
  .cycle-total .unit { font-family: var(--mono); font-size: 10px; color: var(--text-3); margin-left: 5px; }

  /* ===================== CALENDAR ===================== */
  .cal-dow {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 8px; padding: 0 18px 8px;
  }
  .cal-dow span {
    font-family: var(--mono); font-size: 9.5px;
    letter-spacing: 0.09em; text-transform: uppercase; color: var(--text-4);
    text-align: center;
  }
  .cal-grid {
    display: grid; grid-template-columns: repeat(7, 1fr);
    gap: 8px; padding: 0 18px 18px;
  }
  .cal-week-gap { grid-column: 1 / -1; height: 2px; }
  .cal-cell {
    position: relative;
    min-height: 108px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--surface-2);
    padding: 10px 11px;
    display: flex; flex-direction: column; gap: 5px;
    text-align: left;
    font: inherit; color: inherit;
    transition: border-color 180ms var(--ease), background 180ms var(--ease), box-shadow 180ms var(--ease);
  }
  body.unlocked .cal-cell { cursor: pointer; }
  body.unlocked .cal-cell:hover { border-color: var(--border-2); box-shadow: var(--lift); }
  .cal-cell.today { border-color: var(--data); }
  .cal-cell.filled { background: var(--surface); }
  .cal-cell.editing { border-color: var(--text-2); background: var(--surface); }
  .cal-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; }
  .cal-date { font-family: var(--mono); font-size: 12px; color: var(--text-2); }
  .cal-cell.today .cal-date { color: var(--data); }
  .cal-cell.weekend .cal-date { color: var(--text-3); }
  .cal-mon { font-family: var(--mono); font-size: 9px; color: var(--text-4); letter-spacing: 0.06em; text-transform: uppercase; }
  .cal-hours {
    font-family: var(--serif); font-size: 25px; font-weight: 300;
    letter-spacing: -0.03em; line-height: 1;
  }
  .cal-hours .u { font-family: var(--mono); font-size: 10px; color: var(--text-3); margin-left: 3px; }
  .cal-cell.empty .cal-hours { color: var(--text-4); font-size: 20px; }
  .cal-segs { display: flex; flex-direction: column; gap: 2px; margin-top: auto; }
  .cal-seg {
    font-family: var(--mono); font-size: 10px; color: var(--text-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cal-cell.today .cal-seg { color: var(--text); }
  .cal-note {
    font-family: var(--sans); font-size: 10px; color: var(--text-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .cal-flag {
    position: absolute; top: 9px; right: 10px;
    width: 5px; height: 5px; border-radius: 50%; background: var(--amber);
  }

  /* ===================== TIMELINE ===================== */
  .tl-axis {
    display: grid; grid-template-columns: 104px 1fr 74px;
    border-bottom: 1px solid var(--border); background: var(--surface-2);
  }
  .tl-axis-hours { position: relative; height: 28px; }
  .tl-tick {
    position: absolute; top: 8px; transform: translateX(-50%);
    font-family: var(--mono); font-size: 10px; color: var(--text-3); white-space: nowrap;
  }
  .tl-tick.midnight { color: var(--data); }
  .tl-row {
    display: grid; grid-template-columns: 104px 1fr 74px;
    border-bottom: 1px solid var(--border);
    min-height: 34px; align-items: center;
    transition: background 180ms var(--ease);
  }
  .tl-row:last-child { border-bottom: none; }
  .tl-row.week-break { border-top: 1px solid var(--border-2); }
  .tl-row.today { background: rgba(107,179,232,0.06); }
  body.unlocked .tl-row.has-shift { cursor: pointer; }
  body.unlocked .tl-row.has-shift:hover { background: var(--surface-2); }
  .tl-day { display: flex; align-items: baseline; gap: 7px; padding-left: 18px; }
  .tl-day .name { font-family: var(--mono); font-size: 11px; color: var(--text-2); }
  .tl-day .name.weekend { color: var(--text-4); }
  .tl-day .name.today { color: var(--data); }
  .tl-day .date { font-family: var(--mono); font-size: 10px; color: var(--text-4); }
  .tl-track { position: relative; height: 34px; }
  .tl-gridline { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--border); }
  .tl-gridline.midnight { background: var(--data-line); }
  .tl-bar {
    position: absolute; top: 8px; height: 18px;
    background: var(--bar); border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--mono); font-size: 10px; color: var(--bar-text);
    white-space: nowrap; overflow: hidden; min-width: 3px;
    transition: opacity 180ms var(--ease);
  }
  .tl-bar.today { background: var(--data); color: var(--on-accent); }
  .tl-row:hover .tl-bar { opacity: 0.88; }
  .tl-hours {
    font-family: var(--mono); font-size: 11px; color: var(--text);
    text-align: right; padding-right: 18px;
  }
  .tl-hours.empty { color: var(--text-4); }

  /* ===================== FORM ===================== */
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field label, .mini-label {
    font-family: var(--mono); font-size: 9.5px;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3);
  }
  input[type="date"], input[type="time"], input[type="text"],
  input[type="number"], input[type="password"] {
    font-family: var(--mono); font-size: 13px;
    color: var(--text); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; width: 100%;
    transition: border-color 180ms var(--ease);
  }
  input[type="text"]:not(.mono) { font-family: var(--sans); }
  input:focus { outline: none; border-color: var(--text-2); }
  input:disabled { color: var(--text-3); cursor: not-allowed; opacity: 0.65; }
  input[type="number"] { -moz-appearance: textfield; }
  input[type="number"]::-webkit-outer-spin-button,
  input[type="number"]::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  ::-webkit-calendar-picker-indicator { opacity: 0.45; cursor: pointer; }
  ::-webkit-calendar-picker-indicator:hover { opacity: 0.85; }

  .form-stack { display: flex; flex-direction: column; gap: 14px; }
  .seg-head, .seg-row {
    display: grid; grid-template-columns: 1fr 12px 1fr 44px 24px;
    gap: 6px; align-items: center;
  }
  .seg-head span {
    font-family: var(--mono); font-size: 9.5px;
    letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3);
  }
  .seg-head span:nth-child(4) { text-align: right; }
  .seg-list { display: flex; flex-direction: column; gap: 6px; margin-top: 6px; }
  .seg-row .arrow { text-align: center; color: var(--text-4); font-size: 12px; }
  .seg-dur { font-family: var(--mono); font-size: 10px; color: var(--text-2); text-align: right; }
  .seg-dur.invalid { color: var(--text-4); }
  .seg-remove {
    width: 22px; height: 22px;
    border: 1px solid var(--border); border-radius: 5px;
    background: transparent; color: var(--text-3);
    font-family: var(--mono); font-size: 13px; line-height: 1; cursor: pointer;
    transition: all 180ms var(--ease);
  }
  .seg-remove:hover { border-color: var(--red); color: var(--red); background: var(--red-soft); }

  .btn-ghost {
    align-self: flex-start;
    padding: 6px 12px;
    border: 1px dashed var(--border-2); border-radius: 6px;
    background: transparent;
    font-family: var(--mono); font-size: 10.5px; color: var(--text-2);
    cursor: pointer; transition: all 180ms var(--ease);
  }
  .btn-ghost:hover { border-color: var(--text-2); color: var(--text); border-style: solid; }
  .btn-ghost:active { transform: scale(0.98); }

  .readouts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .readout {
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--surface-2); padding: 11px 13px;
    display: flex; flex-direction: column; gap: 1px;
  }
  .readout .v { font-family: var(--serif); font-size: 24px; font-weight: 300; letter-spacing: -0.03em; line-height: 1.05; }
  .readout .u { font-family: var(--mono); font-size: 9.5px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-3); }
  .readout.overnight { background: var(--data-soft); border-color: var(--data-line); }
  .readout.overnight .u { color: var(--data); }
  .readout.muted .v { color: var(--text-3); }

  .form-actions { display: flex; gap: 8px; align-items: center; }
  .btn {
    flex: 1;
    padding: 9px 16px;
    border: 1px solid var(--text); border-radius: 6px;
    background: var(--text); color: var(--canvas);
    font-family: var(--sans); font-size: 13px; font-weight: 500;
    cursor: pointer; transition: background 180ms var(--ease), transform 120ms var(--ease);
  }
  .btn:hover { background: var(--text-hi); border-color: var(--text-hi); }
  .btn:active { transform: scale(0.98); }
  .btn:disabled { background: var(--surface-2); border-color: var(--border); color: var(--text-4); cursor: not-allowed; transform: none; }
  .btn-secondary { flex: 0 0 auto; background: transparent; color: var(--text-2); border-color: var(--border); }
  .btn-secondary:hover { background: var(--surface-2); color: var(--text); border-color: var(--border-2); }
  .btn-danger { flex: 0 0 auto; background: transparent; color: var(--red); border-color: var(--border); }
  .btn-danger:hover { background: var(--red-soft); border-color: var(--red); color: var(--red); }
  [hidden] { display: none !important; }

  /* ===================== CHECKLIST ===================== */
  .check-item {
    display: grid; grid-template-columns: 20px 1fr; gap: 11px;
    padding: 13px 0; border-bottom: 1px solid var(--border);
    align-items: start;
  }
  .check-item:first-child { padding-top: 0; }
  .check-box {
    width: 18px; height: 18px; margin-top: 1px;
    border: 1px solid var(--border-2); border-radius: 5px;
    background: var(--surface-2);
    display: flex; align-items: center; justify-content: center;
    padding: 0; cursor: default;
    transition: all 180ms var(--ease);
  }
  .check-box svg { width: 11px; height: 11px; opacity: 0; transition: opacity 180ms var(--ease); }
  .check-box svg path { stroke: var(--on-accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; fill: none; }
  .check-item.done .check-box { background: var(--green); border-color: var(--green); }
  .check-item.done .check-box svg { opacity: 1; }
  .check-item.warn .check-box { border-color: var(--amber); background: var(--amber-soft); }
  button.check-box { cursor: pointer; }
  body.locked button.check-box { cursor: not-allowed; opacity: 0.55; }
  button.check-box:hover:not(:disabled) { border-color: var(--text-2); }
  .check-text { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .check-title { font-size: 13px; color: var(--text); line-height: 1.35; }
  .check-item.done .check-title { color: var(--text-2); }
  .check-sub { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); line-height: 1.5; }
  .check-sub.warn { color: var(--amber); }
  .check-dates { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .date-chip {
    font-family: var(--mono); font-size: 9.5px;
    padding: 2px 7px; border-radius: 9999px;
    background: var(--amber-soft); color: var(--amber);
    border: 1px solid var(--amber-line);
    cursor: pointer; transition: all 160ms var(--ease);
  }
  .date-chip:hover { border-color: var(--amber); }

  .fx-grid { display: grid; grid-template-columns: 1fr 50px 50px 50px; gap: 7px; align-items: end; }
  .fx-grid input.code { text-align: center; padding-left: 4px; padding-right: 4px; letter-spacing: 0.04em; }
  .fx-status {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-top: 11px; font-family: var(--mono); font-size: 10px; color: var(--text-4);
  }
  .fx-status.stale { color: var(--amber); }
  .fx-refresh {
    flex: 0 0 auto; padding: 3px 9px;
    border: 1px solid var(--border); border-radius: 5px;
    background: transparent; color: var(--text-3);
    font-family: var(--mono); font-size: 10px; cursor: pointer;
    transition: all 160ms var(--ease);
  }
  .fx-refresh:hover { border-color: var(--border-2); color: var(--text); }
  .fx-refresh:disabled { opacity: 0.5; cursor: default; }
  .pay-lines { margin-top: 14px; display: flex; flex-direction: column; gap: 7px; }
  .pay-line {
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    font-family: var(--mono); font-size: 11.5px; color: var(--text-2);
  }
  .pay-line .k { color: var(--text-3); }
  .pay-line .v { color: var(--text); }
  .pay-line.total {
    padding-top: 9px; margin-top: 2px; border-top: 1px solid var(--border);
  }
  .pay-line.total .k { color: var(--text-2); }
  .pay-line.total .v { font-family: var(--serif); font-size: 25px; font-weight: 300; letter-spacing: -0.02em; color: var(--text); }
  .pay-line .v.pos { color: var(--green); }
  .pay-line .v.neg { color: var(--red); }
  .pay-line.step { font-size: 10.5px; padding-left: 10px; color: var(--text-3); }
  .pay-line.step .k { color: var(--text-4); }
  .pay-line.step .v { color: var(--text-2); }
  .pay-line.note { font-size: 10px; color: var(--text-4); }
  .pay-hint { font-family: var(--mono); font-size: 10px; color: var(--text-4); margin-top: 9px; }

  /* ===================== RAIL FOOTER ===================== */
  .rail-foot { display: flex; flex-wrap: wrap; gap: 6px; }
  .btn-text {
    padding: 6px 11px;
    border: 1px solid var(--border); border-radius: 6px;
    background: transparent;
    font-family: var(--mono); font-size: 10.5px; color: var(--text-2);
    cursor: pointer; transition: all 180ms var(--ease);

<script>
/* ============================================================
   CONSTANTS & STATE
   ============================================================ */
const EDIT_PASSWORD = 'Kedhar';
const DATA_KEY   = 'workLog_v3';
const PREFS_KEY  = 'workLog_v3_prefs';
const CYCLES_KEY = 'workLog_v3_cycles';
const FX_KEY     = 'workLog_v3_fx';
const LEGACY_KEY = 'workLog_v2_data_jun4';

// Pay cycles are 14 days counted from this anchor.
const PAY_ANCHOR = new Date(2026, 4, 9);
PAY_ANCHOR.setHours(0, 0, 0, 0);

// ponytail: a segment starting before 06:00 is drawn as the previous evening's
// tail, so a 21:00-02:00 night reads as one bar. Raise it if you ever start a
// real day-shift before 6am.
const NIGHT_TAIL_BEFORE = 6;

const TODAY = new Date();
TODAY.setHours(0, 0, 0, 0);

let shifts = [];
let prefs = { rate: 0, chain: ['USD', 'CAD', 'INR'] };
let cycleRecords = {};
let fx = { ts: 0, base: '', rates: {}, date: '', source: '', error: '' };
let fxBusy = false;
let editingId = null;
let isUnlocked = false;
let viewCycleStart;
let formSegments = [{ start: '21:00', end: '02:00' }];

/* ============================================================
   SEED — imported from work_log_2026-08-09.csv
   ============================================================ */
const SEED_ROWS = [
  ['2026-06-06', '21:00-02:00'], ['2026-06-07', '21:00-02:00'],
  ['2026-06-08', '21:00-01:00'], ['2026-06-09', '21:00-02:30'],
  ['2026-06-10', '21:00-01:00'], ['2026-06-11', '21:00-02:30'],
  ['2026-06-13', '00:00-02:30'], ['2026-06-15', '21:00-02:30'],
  ['2026-06-16', '21:00-02:00'], ['2026-06-17', '21:00-03:30'],
  ['2026-06-18', '22:00-02:40'], ['2026-06-19', '21:00-01:00'],
  ['2026-06-21', '22:00-02:30'], ['2026-06-22', '21:00-02:40'],
  ['2026-06-23', '21:00-02:00'], ['2026-06-24', '22:00-02:00'],
  ['2026-06-25', '21:00-02:30'], ['2026-06-26', '21:00-02:00'],
  ['2026-06-27', '21:00-00:00'], ['2026-06-29', '21:00-01:00'],
  ['2026-06-30', '21:00-23:30|00:00-01:10'],
  ['2026-07-01', '21:00-02:40'], ['2026-07-07', '21:00-03:00'],
  ['2026-07-08', '21:00-02:00'], ['2026-07-10', '21:00-00:30'],
  ['2026-07-12', '21:00-03:00'], ['2026-07-13', '22:00-03:30'],
  ['2026-07-15', '21:00-21:01'], ['2026-07-16', '21:00-02:30'],
  ['2026-07-17', '21:00-02:30'], ['2026-07-18', '21:00-02:30'],
  ['2026-07-19', '21:00-22:00'], ['2026-07-20', '21:00-02:00'],
  ['2026-07-24', '21:00-03:00'], ['2026-07-25', '21:00-04:00'],
  ['2026-07-26', '21:00-04:00'], ['2026-07-27', '21:00-00:00'],
  ['2026-07-28', '21:00-03:00'], ['2026-07-30', '21:00-05:00'],
  ['2026-07-31', '21:00-03:00'], ['2026-08-01', '21:00-02:30'],
  ['2026-08-02', '21:00-22:00'], ['2026-08-03', '10:00-12:00'],
  ['2026-08-05', '21:00-03:00'], ['2026-08-06', '21:00-04:00'],
  ['2026-08-07', '12:00-14:00'], ['2026-08-08', '14:00-16:00|21:00-03:00']
];

function seedShifts() {
  return SEED_ROWS.map(([date, spec], i) => withLegacyFields({
    id: 'seed-' + i, date: date, segments: parseSegmentSpec(spec), note: ''
  }));
}

/* ============================================================
   TIME HELPERS
   ============================================================ */
function fmtDate(d) {
  return d.getFullYear() + '-' +
    String(d.getMonth() + 1).padStart(2, '0') + '-' +
    String(d.getDate()).padStart(2, '0');
}
function parseDate(s) { const [y, m, d] = s.split('-').map(Number); return new Date(y, m - 1, d); }
function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
function parseTime(t) {
  if (!t) return null;
  const [h, m] = t.split(':').map(Number);
  if (!Number.isFinite(h) || !Number.isFinite(m)) return null;
  return h + m / 60;
}
function fmtTime12(t) {
  if (!t) return '—';
  const [h, m] = t.split(':').map(Number);
  const suffix = h < 12 ? 'am' : 'pm';
  const display = h === 0 ? 12 : h > 12 ? h - 12 : h;
  return (m === 0 ? display + ':00' : display + ':' + String(m).padStart(2, '0')) + suffix;
}
function fmtHour(h) {
  const nh = ((h % 24) + 24) % 24;
  const whole = Math.floor(nh), min = Math.round((nh - whole) * 60);
  const suffix = whole < 12 ? 'a' : 'p';
  const display = whole === 0 ? 12 : whole > 12 ? whole - 12 : whole;
  return min === 0 ? display + suffix : display + ':' + String(min).padStart(2, '0') + suffix;
}
function fmtHours(h) { return String(Math.round(h * 100) / 100); }
function sameDay(a, b) {
  return a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
}
/* ============================================================
   SEGMENT MODEL
   A shift is { id, date, segments: [{start,end}], note }.
   start/end are mirrored from the first segment for older readers.
   ============================================================ */
function withLegacyFields(shift) {
  const first = shift.segments[0] || {};
  return Object.assign({}, shift, { start: first.start || '', end: first.end || '', break: 0 });
}
function getSegments(shift) {
  if (!shift) return [];
  if (Array.isArray(shift.segments) && shift.segments.length) {
    return shift.segments.filter(s => s && s.start && s.end);
  }
  if (shift.start && shift.end) return [{ start: shift.start, end: shift.end }];
  return [];
}
function segDuration(seg) {
  const s = parseTime(seg.start), e = parseTime(seg.end);
  if (s === null || e === null) return 0;
  let diff = e - s;
  if (diff <= 0) diff += 24;   // crosses midnight
  return diff;
}
function computeShiftHours(shift) {
  const total = getSegments(shift).reduce((sum, seg) => sum + segDuration(seg), 0);
  return Math.max(0, Math.round(total * 100) / 100);
}

// Lay segments out on a continuous hour line so multi-segment days and
// overnight days both render as a left-to-right sequence.
function placeSegments(segs) {
  if (!segs.length) return [];
  const starts = segs.map(s => parseTime(s.start));
  const maxStart = Math.max.apply(null, starts);
  const key = h => (h < NIGHT_TAIL_BEFORE && maxStart >= 12) ? h + 24 : h;
  const ordered = segs.slice().sort((a, b) => key(parseTime(a.start)) - key(parseTime(b.start)));

  // Whole day sits in the small hours → it belongs to the previous evening.
  const base = starts.every(h => h < NIGHT_TAIL_BEFORE) ? 24 : 0;

  const placed = [];
  let prevEnd = -Infinity;
  ordered.forEach(seg => {
    let s = parseTime(seg.start) + base;
    while (s < prevEnd) s += 24;
    const e = s + segDuration(seg);
    placed.push({ seg: seg, s: s, e: e });
    prevEnd = e;
  });
  return placed;
}
function gapHours(placed) {
  let gap = 0;
  for (let i = 1; i < placed.length; i++) gap += placed[i].s - placed[i - 1].e;
  return Math.max(0, Math.round(gap * 100) / 100);
}
function parseSegmentSpec(spec) {
  return String(spec).split('|').map(part => {
    const bits = part.trim().split(/\s*[-–—]\s*/);
    if (bits.length < 2) return null;
    return { start: bits[0].trim(), end: bits[1].trim() };
  }).filter(s => s && parseTime(s.start) !== null && parseTime(s.end) !== null);
}

/* ============================================================
   PAY CYCLES
   ============================================================ */
function cycleStart(d) {
  const t = new Date(d); t.setHours(0, 0, 0, 0);
  const periodIndex = Math.floor((t - PAY_ANCHOR) / 86400000 / 14);
  return addDays(PAY_ANCHOR, periodIndex * 14);
}
function cycleEnd(start) { return addDays(start, 13); }
function daysUntilPayday(d) {
  return Math.max(0, Math.ceil((addDays(cycleEnd(cycleStart(d)), 1) - d) / 86400000));
}
function cycleDays(start) {
  const out = [];
  for (let i = 0; i < 14; i++) out.push(addDays(start, i));
  return out;
}
function hoursInRange(list, start, end) {
  return list
    .filter(s => { const d = parseDate(s.date); return d >= start && d <= end; })
    .reduce((sum, s) => sum + computeShiftHours(s), 0);
}

// Days in the cycle that have already happened but carry no entry.
function unloggedDays(start, today, list) {
  const logged = new Set(list.filter(s => computeShiftHours(s) > 0).map(s => s.date));
  return cycleDays(start)
    .filter(d => d <= today && !logged.has(fmtDate(d)))
    .map(fmtDate);
}
function estimatePay(hours, rate) {
  return Math.round(hours * (Number(rate) || 0) * 100) / 100;
}

/* ============================================================
   CURRENCY
   Pay is earned in one currency, transferred through a second and
   landed in a third. Rates come from the ECB (mid-market) — the bank
   doing the actual transfer will take a spread on top, so the
   estimate is a ceiling, not a promise.
   ============================================================ */
const SYMBOLS = {
  USD: '$', CAD: 'C$', INR: '₹', EUR: '€', GBP: '£',
  AUD: 'A$', NZD: 'NZ$', JPY: '¥', SGD: 'S$', CHF: 'CHF '
};
function sym(code) { return SYMBOLS[code] || (code ? code + ' ' : ''); }
function fmtMoney(n, code) {
  return sym(code) + Math.abs(n).toLocaleString(code === 'INR' ? 'en-IN' : 'en-US',
    { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtRate(n) {
  return n.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 4 });
}
function cleanCode(v) { return String(v || '').replace(/[^A-Za-z]/g, '').toUpperCase().slice(0, 3); }

// Drop blanks and repeats so USD → (blank) → INR degrades to a direct hop.
function normalizeChain(arr) {
  return arr.map(cleanCode).filter(Boolean).filter((c, i, a) => i === 0 || c !== a[i - 1]);
}
function activeChain() { return normalizeChain(prefs.chain || []); }

// rates are quoted against chain[0]. Returns one step per hop, or null
// if any leg is missing a rate. Value is left unrounded between hops.
function convertChain(amount, chain, rates) {
  if (chain.length < 2) return [];
  const steps = [];
  let value = amount;
  for (let i = 1; i < chain.length; i++) {
    const from = chain[i - 1], to = chain[i];
    const rFrom = i === 1 ? 1 : Number(rates[from]);
    const rTo = Number(rates[to]);
    if (!(rFrom > 0) || !(rTo > 0)) return null;
    const rate = rTo / rFrom;
    value = value * rate;
    steps.push({ from: from, to: to, rate: rate, value: value });
  }
  return steps;
}

const FX_SOURCES = [
  {
    name: 'ECB',
    url: (base, need) => 'https://api.frankfurter.app/latest?from=' + base + '&to=' + need.join(','),
    parse: j => (j && j.rates) ? { rates: j.rates, date: j.date || '' } : null
  },
  {
    name: 'exchangerate-api',
    url: base => 'https://open.er-api.com/v6/latest/' + base,
    parse: j => (j && j.result === 'success' && j.rates)
      ? { rates: j.rates, date: (j.time_last_update_utc || '').slice(5, 16) } : null
  }
];
const FX_MAX_AGE = 6 * 3600 * 1000;

function ratesAreFresh() {
  const chain = activeChain();
  if (chain.length < 2) return true;
  const need = chain.slice(1);
  return fx.base === chain[0] && need.every(c => Number(fx.rates[c]) > 0) &&
    (Date.now() - fx.ts) < FX_MAX_AGE;
}
async function fetchRates(force) {
  const chain = activeChain();
  if (chain.length < 2) return;
  if (ratesAreFresh() && !force) return;

  const base = chain[0], need = chain.slice(1);
  fxBusy = true; renderChecklist();

  for (const src of FX_SOURCES) {
    try {
      const res = await fetch(src.url(base, need), { cache: 'no-store' });
      if (!res.ok) continue;
      const out = src.parse(await res.json());
      if (!out || !need.every(c => Number(out.rates[c]) > 0)) continue;
      fx = { ts: Date.now(), base: base, rates: out.rates, date: out.date, source: src.name, error: '' };
      writeJSON(FX_KEY, fx);
      fxBusy = false; renderChecklist();
      return;
    } catch (e) { /* fall through to the next source */ }
  }
  fx.error = 'offline';
  fxBusy = false; renderChecklist();
}
function rateAge() {
  if (!fx.ts) return '';
  const mins = Math.round((Date.now() - fx.ts) / 60000);
  if (mins < 2) return 'just now';
  if (mins < 60) return mins + 'm ago';
  const hrs = Math.round(mins / 60);
  if (hrs < 48) return hrs + 'h ago';
  return Math.round(hrs / 24) + 'd ago';
}

/* ============================================================
   PERSISTENCE
   ============================================================ */
function readJSON(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (e) { return fallback; }
}
function writeJSON(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); return true; }
  catch (e) { toast('Could not save locally', true); return false; }
}
function loadShifts() {
  const fromKey = key => {
    const parsed = readJSON(key, null);
    if (!Array.isArray(parsed) || !parsed.length) return null;
    return parsed.map(s => withLegacyFields({
      id: s.id || 'shift-' + Math.random().toString(36).slice(2),
      date: s.date,
      segments: getSegments(s),
      note: s.note || ''
    })).filter(s => s.date && s.segments.length);
  };
  return fromKey(DATA_KEY) || fromKey(LEGACY_KEY) || seedShifts();
}
function persist() { writeJSON(DATA_KEY, shifts); }
function persistPrefs() { writeJSON(PREFS_KEY, prefs); }
function persistCycles() { writeJSON(CYCLES_KEY, cycleRecords); }
function shiftFor(date) { return shifts.find(s => s.date === date); }
function recordFor(startStr) {
  if (!cycleRecords[startStr]) cycleRecords[startStr] = { paid: false, received: null };
  return cycleRecords[startStr];
}

/* ============================================================
   LOCK
   ============================================================ */
function setLocked(locked) {
  isUnlocked = !locked;
  document.body.classList.toggle('unlocked', isUnlocked);
  document.body.classList.toggle('locked', locked);
  document.getElementById('lock-text').textContent = isUnlocked ? 'Editable' : 'Read only';
  document.querySelectorAll('.panel input, .panel .btn, .panel .btn-ghost, button.check-box')
    .forEach(el => { el.disabled = !isUnlocked; });
  if (locked) cancelEdit();
}
function showPwPrompt() {
  document.getElementById('pw-backdrop').classList.add('visible');
  setTimeout(() => document.getElementById('pw-input').focus(), 50);
}
function hidePwPrompt() {
  document.getElementById('pw-backdrop').classList.remove('visible');
  document.getElementById('pw-input').value = '';
}
function tryUnlock() {
  if (document.getElementById('pw-input').value === EDIT_PASSWORD) {
    setLocked(false); hidePwPrompt(); toast('Editing unlocked');
  } else {
    const card = document.getElementById('pw-card');
    card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
    document.getElementById('pw-input').value = '';
  }
}
function toggleLock() {
  if (isUnlocked) { setLocked(true); render(); toast('Locked'); }
  else showPwPrompt();
}

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  document.getElementById('header-date').textContent =
    TODAY.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric' });
  renderStats();
  renderCalendar();
  renderTimeline();
  renderChecklist();
  renderSegments();
  updateComputed();
}

function renderStats() {
  const curStart = cycleStart(TODAY), curEnd = cycleEnd(curStart);
  const prvStart = addDays(curStart, -14), prvEnd = cycleEnd(prvStart);
  const cur = hoursInRange(shifts, curStart, curEnd);
  const prv = hoursInRange(shifts, prvStart, prvEnd);
  const total = shifts.reduce((sum, s) => sum + computeShiftHours(s), 0);
  const days = daysUntilPayday(TODAY);

  setStat('stat-cur', cur, 'hrs');
  setStat('stat-prev', prv, 'hrs');
  setStat('stat-total', total, 'hrs');
  document.getElementById('stat-days').innerHTML =
    days + '<span class="unit">' + (days === 1 ? 'day' : 'days') + '</span>';

  const el = document.getElementById('delta-cur');
  const set = (t, c) => { el.textContent = t; el.className = 'stat-delta ' + c; };
  if (!prv && !cur) set('—', 'flat');
  else if (!prv) set('New', 'up');
  else {
    const pct = Math.round(((cur - prv) / prv) * 100);
    if (Math.abs(pct) < 1) set('level', 'flat');
    else set((pct > 0 ? '▲ ' : '▼ ') + Math.abs(pct) + '%', pct > 0 ? 'up' : 'down');
  }

  const range = (a, b) =>
    a.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' – ' +
    b.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  document.getElementById('sub-cur').textContent = range(curStart, curEnd);
  document.getElementById('sub-prev').textContent = range(prvStart, prvEnd);
  document.getElementById('sub-days').textContent = days === 0
    ? 'Cycle ends today'
    : 'Ends ' + curEnd.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  document.getElementById('sub-total').textContent =
    shifts.filter(s => computeShiftHours(s) > 0).length + ' entries logged';
}
function setStat(id, value, unit) {
  const el = document.getElementById(id);
  const v = Math.round(value * 10) / 10;
  el.innerHTML = (v || 0) + '<span class="unit">' + unit + '</span>';
  el.classList.toggle('empty', v === 0);
}

function renderCalendar() {
  const start = viewCycleStart, end = cycleEnd(start);
  document.getElementById('cycle-label').textContent =
    start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' – ' +
    end.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

  const days = cycleDays(start);
  const total = days.reduce((sum, d) => sum + computeShiftHours(shiftFor(fmtDate(d))), 0);
  document.getElementById('cycle-total').innerHTML =
    (Math.round(total * 10) / 10) + '<span class="unit">hrs</span>';

  let html = '';
  days.forEach((d, i) => {
    if (i === 7) html += '<div class="cal-week-gap"></div>';
    const ds = fmtDate(d);
    const shift = shiftFor(ds);
    const segs = getSegments(shift);
    const hrs = computeShiftHours(shift);
    const dow = d.getDay();
    const missed = !shift && d <= TODAY;

    const segLines = placeSegments(segs).map(p =>
      '<span class="cal-seg">' + fmtTime12(p.seg.start) + ' → ' + fmtTime12(p.seg.end) + '</span>'
    ).join('');

    html += '<button type="button" class="cal-cell' +
      (sameDay(d, TODAY) ? ' today' : '') +
      (hrs > 0 ? ' filled' : ' empty') +
      (dow === 0 || dow === 6 ? ' weekend' : '') +
      (shift && editingId === shift.id ? ' editing' : '') +
      '" data-date="' + ds + '">' +
      (missed ? '<span class="cal-flag" title="No entry"></span>' : '') +
      '<div class="cal-top">' +
        '<span class="cal-date">' + d.getDate() + '</span>' +
        '<span class="cal-mon">' + d.toLocaleDateString('en-US', { month: 'short' }) + '</span>' +
      '</div>' +
      '<div class="cal-hours">' + (hrs > 0 ? fmtHours(hrs) + '<span class="u">h</span>' : '—') + '</div>' +
      '<div class="cal-segs">' + segLines +
        (shift && shift.note ? '<span class="cal-note">' + escapeHTML(shift.note) + '</span>' : '') +
      '</div></button>';
  });
  document.getElementById('cal-grid').innerHTML = html;
}
function escapeHTML(s) {
  return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function renderTimeline() {
  const days = cycleDays(viewCycleStart).map(d => ({ date: d, shift: shiftFor(fmtDate(d)) }));
  const laid = days.map(x => ({ day: x, placed: placeSegments(getSegments(x.shift)) }));

  let min = null, max = null;
  laid.forEach(({ placed }) => placed.forEach(p => {
    if (min === null || p.s < min) min = p.s;
    if (max === null || p.e > max) max = p.e;
  }));
  if (min === null) { min = 18; max = 30; }

  const axisStart = Math.max(0, Math.floor(min - 0.5));
  let axisEnd = Math.min(48, Math.ceil(max + 0.5));
  if (axisEnd - axisStart < 4) axisEnd = axisStart + 4;
  const span = axisEnd - axisStart;
  const toPct = h => ((h - axisStart) / span) * 100;
  const step = span <= 8 ? 1 : span <= 14 ? 2 : span <= 22 ? 3 : 4;

  document.getElementById('tl-meta').textContent =
    fmtHour(axisStart) + ' – ' + fmtHour(axisEnd) + (axisEnd > 24 ? ' next day' : '');

  const ticks = [];
  for (let h = Math.ceil(axisStart); h <= axisEnd; h += step) ticks.push(h);

  document.getElementById('tl-axis-hours').innerHTML = ticks.map(h => {
    const pct = toPct(h);
    if (pct < 0 || pct > 100) return '';
    const midnight = ((h % 24) + 24) % 24 === 0;
    return '<div class="tl-tick' + (midnight ? ' midnight' : '') +
      '" style="left:' + pct.toFixed(3) + '%">' + fmtHour(h) + '</div>';
  }).join('');

  const dayNames = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  document.getElementById('tl-rows').innerHTML = laid.map(({ day, placed }, i) => {
    const d = day.date, dow = d.getDay(), isToday = sameDay(d, TODAY);

    let track = ticks.map(h => {
      const pct = toPct(h);
      if (pct <= 0 || pct >= 100) return '';
      const midnight = ((h % 24) + 24) % 24 === 0;
      return '<div class="tl-gridline' + (midnight ? ' midnight' : '') +
        '" style="left:' + pct.toFixed(3) + '%"></div>';
    }).join('');

    track += placed.map(p => {
      const left = toPct(p.s), width = toPct(p.e) - left;
      const label = width > 15 ? fmtTime12(p.seg.start) + ' → ' + fmtTime12(p.seg.end)
        : width > 8 ? fmtHour(p.s) + '–' + fmtHour(p.e) : '';
      return '<div class="tl-bar' + (isToday ? ' today' : '') +
        '" style="left:' + left.toFixed(3) + '%;width:' + Math.max(width, 0.4).toFixed(3) + '%"' +
        ' title="' + fmtTime12(p.seg.start) + ' – ' + fmtTime12(p.seg.end) +
        ' · ' + fmtHours(segDuration(p.seg)) + 'h">' + label + '</div>';
    }).join('');

    const hrs = computeShiftHours(day.shift);
    return '<div class="tl-row' + (isToday ? ' today' : '') + (i === 7 ? ' week-break' : '') +
      (day.shift ? ' has-shift' : '') + '" data-date="' + fmtDate(d) + '">' +
      '<div class="tl-day"><span class="name' + (dow === 0 || dow === 6 ? ' weekend' : '') +
      (isToday ? ' today' : '') + '">' + dayNames[dow] + '</span>' +
      '<span class="date">' + d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + '</span></div>' +
      '<div class="tl-track">' + track + '</div>' +
      '<div class="tl-hours' + (hrs ? '' : ' empty') + '">' + (hrs ? fmtHours(hrs) + 'h' : '—') + '</div>' +
      '</div>';
  }).join('');
}

/* ============================================================
   CHECKLIST
   ============================================================ */
const CHECK_SVG = '<svg viewBox="0 0 12 12"><path d="M2 6.4 L4.6 9 L10 3.2"/></svg>';

function renderChecklist() {
  const start = viewCycleStart, end = cycleEnd(start);
  const startStr = fmtDate(start);
  const rec = recordFor(startStr);
  const hours = hoursInRange(shifts, start, end);
  const logged = cycleDays(start).filter(d => computeShiftHours(shiftFor(fmtDate(d))) > 0).length;
  const pending = unloggedDays(start, TODAY, shifts);
  const remaining = cycleDays(start).filter(d => d > TODAY).length;
  const estimate = estimatePay(hours, prefs.rate);
  const received = rec.received;

  document.getElementById('check-cycle').textContent =
    start.toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) + ' – ' +
    end.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });

  const item = (opts) =>
    '<div class="check-item ' + (opts.state || '') + '">' +
      (opts.button
        ? '<button class="check-box" id="' + opts.button + '" title="Toggle">' + CHECK_SVG + '</button>'
        : '<span class="check-box">' + CHECK_SVG + '</span>') +
      '<div class="check-text">' +
        '<span class="check-title">' + opts.title + '</span>' +
        '<span class="check-sub' + (opts.warn ? ' warn' : '') + '">' + opts.sub + '</span>' +
        (opts.extra || '') +
      '</div></div>';

  let html = '';

  // 1 — every day accounted for
  html += item({
    state: pending.length ? 'warn' : 'done',
    title: 'Every day in this cycle accounted for',
    warn: pending.length > 0,
    sub: pending.length
      ? pending.length + ' day' + (pending.length === 1 ? '' : 's') + ' with no entry' +
        (remaining ? ' · ' + remaining + ' still to come' : '')
      : logged + ' day' + (logged === 1 ? '' : 's') + ' logged' +
        (remaining ? ' · ' + remaining + ' still to come' : ' · cycle complete'),
    extra: pending.length
      ? '<div class="check-dates">' + pending.map(ds =>
          '<button class="date-chip" data-jump="' + ds + '">' +
          parseDate(ds).toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) +
          '</button>').join('') + '</div>'
      : ''
  });

  const chain = activeChain();
  const payCur = chain[0] || 'USD';
  const getCur = chain[chain.length - 1] || payCur;
  const steps = convertChain(estimate, chain, fx.rates);
  const landed = steps && steps.length ? steps[steps.length - 1].value : estimate;

  // 2 — paid
  html += item({
    state: rec.paid ? 'done' : '',
    button: 'toggle-paid',
    title: 'Paid for all ' + fmtHours(hours) + ' hours in this cycle',
    sub: rec.paid
      ? 'Marked paid' + (received != null ? ' · ' + fmtMoney(received, getCur) + ' received' : '')
      : 'Not marked yet · payday ' + addDays(end, 1).toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
  });

  document.getElementById('check-list').innerHTML = html;

  // 3 — what it should come to, hop by hop
  let lines =
    line('Hours logged', fmtHours(hours) + ' h') +
    line('Hourly rate', prefs.rate ? fmtMoney(prefs.rate, payCur) + ' /hr' : '— not set') +
    line('Earned · ' + payCur, fmtMoney(estimate, payCur));

  if (steps === null) {
    lines += line('Conversion', 'rates unavailable', 'note');
  } else {
    steps.forEach(st => {
      lines += line(st.from + ' → ' + st.to + '  × ' + fmtRate(st.rate),
        fmtMoney(st.value, st.to), 'step');
    });
  }
  lines += line('You receive · ' + getCur, fmtMoney(landed, getCur), 'total');

  if (received != null) {
    const diff = Math.round((received - landed) * 100) / 100;
    lines += line('Actually received', fmtMoney(received, getCur));
    lines += line(
      diff === 0 ? 'Matches the estimate' : diff > 0 ? 'Over the estimate' : 'Short of the estimate',
      (diff > 0 ? '+' : diff < 0 ? '−' : '') + fmtMoney(diff, getCur),
      '', diff > 0 ? 'pos' : diff < 0 ? 'neg' : ''
    );
    if (estimate > 0 && payCur !== getCur) {
      lines += line('Effective 1 ' + payCur, fmtMoney(received / estimate, getCur), 'step');
    }
  }
  document.getElementById('pay-lines').innerHTML = lines;

  setInputValue('in-rate', prefs.rate || '');
  setInputValue('in-cur-from', chain[0] || '');
  setInputValue('in-cur-via', chain.length > 2 ? chain[1] : (prefs.chain[1] || ''));
  setInputValue('in-cur-to', getCur);
  setInputValue('in-received', received == null ? '' : received);
  document.getElementById('received-cur').textContent = getCur ? '(' + getCur + ')' : '';
  renderFxStatus();
  document.getElementById('pay-hint').textContent = prefs.rate
    ? 'Mid-market rates. Your bank takes a spread on top, so treat this as the ceiling.'
    : 'Set an hourly rate to estimate this cycle.';

  const btn = document.getElementById('toggle-paid');
  if (btn) {
    btn.disabled = !isUnlocked;
    btn.addEventListener('click', () => {
      rec.paid = !rec.paid;
      persistCycles(); renderChecklist();
      toast(rec.paid ? 'Cycle marked paid' : 'Cycle marked unpaid');
    });
  }
  document.querySelectorAll('[data-jump]').forEach(chip => {
    chip.addEventListener('click', () => {
      if (!isUnlocked) return toast('Unlock editing first', true);
      startEntryFor(chip.dataset.jump);
    });
  });
}
function renderFxStatus() {
  const el = document.getElementById('fx-status');
  const stale = !ratesAreFresh();
  let text;
  if (fxBusy) text = 'Fetching live rates…';
  else if (!fx.ts) text = fx.error ? 'Rates unavailable — offline?' : 'No rates yet';
  else text = fx.source + ' mid-market' + (fx.date ? ' · ' + fx.date : '') + ' · checked ' + rateAge() +
    (fx.error ? ' · refresh failed' : '');

  el.className = 'fx-status' + (stale && !fxBusy ? ' stale' : '');
  el.innerHTML = '<span>' + escapeHTML(text) + '</span>' +
    '<button class="fx-refresh" id="fx-refresh"' + (fxBusy ? ' disabled' : '') + '>Refresh</button>';
  const btn = document.getElementById('fx-refresh');
  if (btn) btn.addEventListener('click', () => fetchRates(true));
}

// Never overwrite the field being typed into — "18." would round back to "18".
function setInputValue(id, value) {
  const el = document.getElementById(id);
  if (document.activeElement !== el) el.value = value;
}
function line(k, v, cls, vcls) {
  return '<div class="pay-line ' + (cls || '') + '">' +
    '<span class="k">' + k + '</span>' +
    '<span class="v ' + (vcls || '') + '">' + v + '</span></div>';
}

/* ============================================================
   FORM
   ============================================================ */
function renderSegments() {
  const list = document.getElementById('seg-list');
  list.innerHTML = formSegments.map((seg, i) => {
    const valid = seg.start && seg.end;
    return '<div class="seg-row">' +
      '<input type="time" class="seg-start" data-idx="' + i + '" value="' + (seg.start || '') + '" />' +
      '<span class="arrow">→</span>' +
      '<input type="time" class="seg-end" data-idx="' + i + '" value="' + (seg.end || '') + '" />' +
      '<span class="seg-dur' + (valid ? '' : ' invalid') + '">' + (valid ? fmtHours(segDuration(seg)) : '—') + '</span>' +
      '<button type="button" class="seg-remove" data-idx="' + i + '" title="Remove segment">×</button>' +
      '</div>';
  }).join('');

  list.querySelectorAll('input').forEach(el => {
    el.disabled = !isUnlocked;
    el.addEventListener('input', e => {
      const idx = Number(e.target.dataset.idx);
      const field = e.target.classList.contains('seg-start') ? 'start' : 'end';
      if (formSegments[idx]) formSegments[idx][field] = e.target.value;
      updateSegDurations();
      updateComputed();
    });
  });
  list.querySelectorAll('.seg-remove').forEach(btn => {
    btn.disabled = !isUnlocked;
    btn.addEventListener('click', () => {
      formSegments.splice(Number(btn.dataset.idx), 1);
      if (!formSegments.length) formSegments = [{ start: '', end: '' }];
      renderSegments(); updateComputed();
    });
  });
}
// Update only the duration labels so typing never rebuilds (and blurs) the inputs.
function updateSegDurations() {
  document.querySelectorAll('#seg-list .seg-row').forEach((row, i) => {
    const seg = formSegments[i]; if (!seg) return;
    const el = row.querySelector('.seg-dur');
    const valid = seg.start && seg.end;
    el.textContent = valid ? fmtHours(segDuration(seg)) : '—';
    el.classList.toggle('invalid', !valid);
  });
}
function updateComputed() {
  const valid = formSegments.filter(s => s.start && s.end);
  const placed = placeSegments(valid);
  const worked = valid.reduce((sum, s) => sum + segDuration(s), 0);
  const gap = gapHours(placed);
  const overnight = placed.some(p => p.e > 24 || p.s >= 24);

  document.getElementById('computed-v').textContent = fmtHours(worked) || '0';
  document.getElementById('computed-u').textContent = overnight ? 'Hours · overnight' : 'Hours';
  document.getElementById('computed').classList.toggle('overnight', overnight);
  document.getElementById('break-v').textContent = fmtHours(gap);
  document.getElementById('break-readout').classList.toggle('muted', gap <= 0);
}
function addSegment() {
  const last = formSegments[formSegments.length - 1];
  let start = '';
  if (last && last.end) {
    const e = parseTime(last.end);
    if (e !== null) start = String(Math.floor((Math.ceil(e) + 1) % 24)).padStart(2, '0') + ':00';
  }
  formSegments.push({ start: start, end: '' });
  renderSegments(); updateComputed();
}
function startEntryFor(date) {
  const shift = shiftFor(date);
  if (shift) return loadIntoForm(date);
  cancelEdit();
  document.getElementById('in-date').value = date;
  formSegments = [{ start: '', end: '' }];
  document.getElementById('form-title').textContent =
    'New · ' + parseDate(date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  renderSegments(); updateComputed(); renderCalendar();
  focusForm();
}
function loadIntoForm(date) {
  const shift = shiftFor(date);
  if (!shift) return;
  editingId = shift.id;
  formSegments = getSegments(shift).map(s => ({ start: s.start, end: s.end }));
  if (!formSegments.length) formSegments = [{ start: '', end: '' }];
  document.getElementById('in-date').value = shift.date;
  document.getElementById('in-note').value = shift.note || '';
  document.getElementById('form-title').textContent =
    'Editing · ' + parseDate(shift.date).toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  document.getElementById('btn-save').textContent = 'Update';
  document.getElementById('btn-cancel').hidden = false;
  document.getElementById('btn-delete').hidden = false;
  renderSegments(); updateComputed(); renderCalendar();
  focusForm();
}
function focusForm() {
  if (window.matchMedia('(max-width: 1240px)').matches) {
    document.getElementById('in-date').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}
function cancelEdit() {
  editingId = null;
  document.getElementById('form-title').textContent = 'Log a shift';
  document.getElementById('btn-save').textContent = 'Save entry';
  document.getElementById('btn-cancel').hidden = true;
  document.getElementById('btn-delete').hidden = true;
  document.getElementById('in-note').value = '';
  document.getElementById('in-date').value = fmtDate(TODAY);
  formSegments = [{ start: '21:00', end: '02:00' }];
}

function saveShift() {
  if (!isUnlocked) return;
  const date = document.getElementById('in-date').value;
  if (!date) return toast('Pick a date', true);

  const valid = formSegments.filter(s => s.start && s.end);
  if (!valid.length) return toast('Add at least one start and end time', true);

  // Store in chronological order so the timeline and gap maths agree.
  const ordered = placeSegments(valid).map(p => ({ start: p.seg.start, end: p.seg.end }));
  const idx = editingId
    ? shifts.findIndex(s => s.id === editingId)
    : shifts.findIndex(s => s.date === date);

  const entry = withLegacyFields({
    id: idx >= 0 ? shifts[idx].id : 'shift-' + Date.now(),
    date: date,
    segments: ordered,
    note: document.getElementById('in-note').value.trim()
  });

  if (idx >= 0) shifts[idx] = entry; else shifts.push(entry);
  shifts.sort((a, b) => a.date.localeCompare(b.date));
  persist();
  toast(idx >= 0 ? 'Entry updated' : 'Entry saved');
  cancelEdit();
  viewCycleStart = cycleStart(parseDate(date));
  render();
}
function deleteShift() {
  if (!isUnlocked || !editingId) return;
  const shift = shifts.find(s => s.id === editingId);
  if (!shift) return;
  if (!confirm('Delete the entry for ' + shift.date + '?')) return;
  shifts = shifts.filter(s => s.id !== editingId);
  persist(); cancelEdit(); render();
  toast('Entry deleted');
}

/* ============================================================
   CSV
   ============================================================ */
function csvCell(v) { return '"' + String(v).replace(/"/g, '""') + '"'; }

function exportCSV() {
  const rows = [['Date', 'Day', 'Segments', 'Hours', 'Note']];
  shifts.slice().sort((a, b) => a.date.localeCompare(b.date)).forEach(s => {
    rows.push([
      s.date,
      parseDate(s.date).toLocaleDateString('en-US', { weekday: 'long' }),
      getSegments(s).map(seg => seg.start + '-' + seg.end).join(' | '),
      fmtHours(computeShiftHours(s)),
      s.note || ''
    ]);
  });
  // BOM keeps Excel from mangling the file; ASCII separators keep the times readable.
  const csv = '﻿' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
  const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url;
  a.download = 'work_log_' + fmtDate(new Date()) + '.csv';
  a.click();
  URL.revokeObjectURL(url);
  toast('Exported ' + (rows.length - 1) + ' entries');
}

function parseCSV(text) {
  const rows = [];
  let row = [], cell = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"') {
        if (text[i + 1] === '"') { cell += '"'; i++; } else quoted = false;
      } else cell += c;
    } else if (c === '"') quoted = true;
    else if (c === ',') { row.push(cell); cell = ''; }
    else if (c === '\n') { row.push(cell); rows.push(row); row = []; cell = ''; }
    else if (c !== '\r') cell += c;
  }
  if (cell !== '' || row.length) { row.push(cell); rows.push(row); }
  return rows;
}

function importCSV(text) {
  const rows = parseCSV(text.replace(/^﻿/, ''));
  if (!rows.length) return toast('That file looks empty', true);
  if (/date/i.test(rows[0][0] || '')) rows.shift();

  let added = 0, replaced = 0;
  rows.forEach(r => {
    const date = (r[0] || '').trim();
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return;
    const segments = parseSegmentSpec(r[2] || '');
    if (!segments.length) return;
    const entry = withLegacyFields({
      id: 'csv-' + date, date: date, segments: segments, note: (r[4] || '').trim()
    });
    const idx = shifts.findIndex(s => s.date === date);
    if (idx >= 0) { entry.id = shifts[idx].id; shifts[idx] = entry; replaced++; }
    else { shifts.push(entry); added++; }
  });

  if (!added && !replaced) return toast('No valid rows found', true);
  shifts.sort((a, b) => a.date.localeCompare(b.date));
  persist(); render();
  toast('Imported ' + added + ' new, updated ' + replaced);
}

function resetToSeed() {
  if (!isUnlocked) return toast('Unlock editing first', true);
  if (!confirm('Replace every entry with the imported CSV baseline?')) return;
  shifts = seedShifts();
  persist(); render(); toast('Reset to baseline');
}

/* ============================================================
   MISC UI
   ============================================================ */
let toastTimer;
function toast(msg, isError) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.toggle('error', !!isError);
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}
function initReveal() {
  const items = document.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window)) {
    items.forEach(el => el.classList.add('in'));
    return;
  }
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target); } });
  }, { rootMargin: '0px 0px -30px 0px', threshold: 0.02 });
  items.forEach(el => io.observe(el));
}

/* ============================================================
   SELF CHECK — open index.html?selftest and read the console
   ============================================================ */
function selfTest() {
  const ok = (cond, label) => { if (!cond) throw new Error('FAILED: ' + label); console.log('ok — ' + label); };
  const round = n => Math.round(n * 100) / 100;

  // Their example: 9-10, 12-15, 17-18 → three separate bars, ascending, 5h worked, 4h gap.
  const day = [{ start: '09:00', end: '10:00' }, { start: '12:00', end: '15:00' }, { start: '17:00', end: '18:00' }];
  const p = placeSegments(day);
  ok(p.length === 3, 'three segments placed');
  ok(p[0].s === 9 && p[1].s === 12 && p[2].s === 17, 'daytime segments keep their own hours');
  ok(p[0].e < p[1].s && p[1].e < p[2].s, 'segments stay in ascending order');
  ok(round(computeShiftHours({ segments: day })) === 5, 'worked hours = 5');
  ok(gapHours(p) === 4, 'unpaid gap = 4');

  ok(round(computeShiftHours({ segments: [{ start: '21:00', end: '02:00' }] })) === 5, 'overnight 21:00-02:00 = 5h');

  const night = placeSegments([{ start: '21:00', end: '23:30' }, { start: '00:00', end: '01:10' }]);
  ok(night[0].s === 21 && night[1].s === 24, 'post-midnight segment placed after the evening one');
  ok(round(gapHours(night)) === 0.5, 'midnight split keeps its 30 min gap');

  ok(placeSegments([{ start: '00:00', end: '02:30' }])[0].s === 24, 'small-hours-only day shifts to the night lane');
  ok(placeSegments([{ start: '10:00', end: '12:00' }])[0].s === 10, 'morning shift stays in the morning');

  // Cycles
  const cs = cycleStart(new Date(2026, 7, 9));
  ok(fmtDate(cs) === '2026-08-01', 'Aug 9 falls in the cycle starting Aug 1');
  ok(fmtDate(cycleEnd(cs)) === '2026-08-14', 'that cycle ends Aug 14');
  ok(cycleDays(cs).length === 14, 'a cycle is 14 days');

  // Unlogged days: only past days without an entry, never future ones.
  const sample = [
    { date: '2026-08-01', segments: [{ start: '21:00', end: '23:00' }] },
    { date: '2026-08-03', segments: [{ start: '10:00', end: '12:00' }] }
  ];
  const pend = unloggedDays(cs, new Date(2026, 7, 4), sample);
  ok(pend.join() === '2026-08-02,2026-08-04', 'pending days are the gaps up to today only');
  ok(unloggedDays(cs, new Date(2026, 6, 20), sample).length === 0, 'a cycle that has not started has no pending days');

  // Pay maths
  ok(estimatePay(34.5, 18) === 621, '34.5h at 18/hr = 621');
  ok(estimatePay(5.67, 12.5) === 70.88, 'estimate rounds to cents');
  ok(estimatePay(10, 0) === 0, 'no rate means no estimate');
  ok(hoursInRange(sample, cs, cycleEnd(cs)) === 4, 'hours in range sums the cycle');

  // Currency chain
  const rates = { CAD: 1.401, INR: 95.21 };
  const st = convertChain(681.25, ['USD', 'CAD', 'INR'], rates);
  ok(st.length === 2, 'USD → CAD → INR is two hops');
  ok(round(st[0].value) === 954.43, 'first hop applies the USD→CAD rate');
  ok(round(st[1].rate * 10000) / 10000 === round(95.21 / 1.401 * 10000) / 10000, 'second hop uses the CAD→INR cross rate');
  ok(round(st[1].value) === round(681.25 * 95.21),
     'routing through CAD lands on the same INR as converting direct');
  ok(convertChain(100, ['USD', 'CAD', 'INR'], { CAD: 1.401 }) === null, 'a missing rate returns null, not a wrong number');
  ok(convertChain(100, ['USD'], rates).length === 0, 'a single-currency chain has no hops');
  ok(normalizeChain(['usd', '', 'inr']).join() === 'USD,INR', 'a blank middle leg collapses to a direct hop');
  ok(normalizeChain([' u s d ', 'CAD', 'CAD']).join() === 'USD,CAD', 'codes are cleaned and repeats dropped');
  ok(estimatePay(54.5, 12.5) === 681.25, '54.5h at 12.50/hr = 681.25');

  // CSV
  ok(parseSegmentSpec('21:00–23:30|00:00-01:10').length === 2, 'CSV segment spec parses both dash styles');
  ok(parseCSV('"a","b"\r\n"c,1","d""e"')[1][0] === 'c,1', 'CSV parser handles quoted commas');
  ok(parseCSV('"a","b"\r\n"c,1","d""e"')[1][1] === 'd"e', 'CSV parser handles escaped quotes');

  console.log('%cAll self checks passed', 'color:#7FBF86');
}
